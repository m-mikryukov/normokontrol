# Диссертация в виде рукописи: ГОСТ Р 7.0.11-2011
# «Диссертация и автореферат диссертации. Структура и правила оформления», разделы 4–5.
# Пункты сверены с текстом стандарта, см. references/gost-r-7.0.11-2011.md.
#
# Профиль самостоятельный (без extends): ГОСТ Р 7.0.11 задаёт меньше требований,
# чем ГОСТ 7.32, и чужие правила наследовать нельзя. Чего стандарт не задаёт
# (гарнитура, полужирность, регистр заголовков), то здесь не проверяется —
# это требования диссертационного совета, их добавляют профилем-наследником.
#
# Рисунки, таблицы, формулы и приложения стандарт отсылает к ГОСТ 2.105-95,
# который заменён ГОСТ Р 2.105-2019 (п. 2 ГОСТ Р 7.0.11: применяется заменяющий стандарт).

name: ГОСТ Р 7.0.11-2011 — диссертация (рукопись)
id: gost-r-7.0.11-2011-dissertation
document_types: [dissertation]
standards: [gost-r-7.0.11-2011, gost-r-2.105-2019, gost-r-7.0.100-2018, gost-r-7.0.5-2008]
readiness: beta

page:
  size: A4                 # п. 5.3.6
  margins_mm:              # п. 5.3.7
    left: 25
    right: 10
    top: 20
    bottom: 20
  tolerance_mm: 0.5

text:
  size_pt_min: 12          # п. 5.3.6: «размером шрифта 12–14 пунктов»
  size_pt_max: 14
  line_spacing: 1.5        # п. 5.3.6: «через полтора интервала»
  # п. 5.3.7: отступ «равен пяти знакам»; в сантиметрах стандарт его не задаёт.
  # Диапазон взят из ГОСТ Р 2.105-2019, п. 5.1.4: «пяти знакам … (12,5–17 мм)».
  first_line_indent_cm: [1.25, 1.7]
  alignment: justify       # стандартом не задано; общепринятая практика

page_numbers:              # п. 5.3.8
  style: arabic
  position: top_center     # «на середине верхнего поля страницы»
  title_page_counted: true
  title_page_shown: false

headings:
  structural_elements:     # раздел 4
    names:
      - ОГЛАВЛЕНИЕ
      - ВВЕДЕНИЕ
      - ЗАКЛЮЧЕНИЕ
      - СПИСОК СОКРАЩЕНИЙ И УСЛОВНЫХ ОБОЗНАЧЕНИЙ
      - СЛОВАРЬ ТЕРМИНОВ
      - СПИСОК ЛИТЕРАТУРЫ
      - СПИСОК ИЛЛЮСТРАТИВНОГО МАТЕРИАЛА
    required: [ОГЛАВЛЕНИЕ, ВВЕДЕНИЕ, ЗАКЛЮЧЕНИЕ, СПИСОК ЛИТЕРАТУРЫ]
    alignment: center      # п. 5.3.5: «посередине страницы без точки на конце»
    trailing_dot: false
    new_page: true         # стандарт требует новую страницу для глав (п. 5.3.4); для элементов — практика
  sections:                # главы и параграфы, п. 5.3.2, 5.3.4, 5.3.5
    alignment: center
    trailing_dot: false
    numbering: arabic
    new_page_levels: [1]   # «каждую главу (раздел) начинают с новой страницы»
  # п. 5.3.5: «отделяют от текста сверху и снизу тремя интервалами» — проверяется глазами по рендеру

appendices:                # п. 5.7, оформление — по ГОСТ Р 2.105-2019
  heading_word: ПРИЛОЖЕНИЕ
  alignment: center

figures:                   # п. 5.3.9; ГОСТ Р 2.105-2019, п. 6.9
  caption_format: "Рисунок {n} — {title}"
  references_required: true

tables:                    # п. 5.3.10; ГОСТ Р 2.105-2019, п. 6.8
  caption_position: above
  caption_format: "Таблица {n} — {title}"
  references_required: true

formulas:                  # п. 5.3.11
  numbering: "({n})"
  number_alignment: right

bibliography:              # п. 5.6
  heading: СПИСОК ЛИТЕРАТУРЫ
  heading_aliases:
    - СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ
    - СПИСОК ИСПОЛЬЗОВАННОЙ ЛИТЕРАТУРЫ
    - БИБЛИОГРАФИЧЕСКИЙ СПИСОК
  standard: ГОСТ Р 7.0.100-2018   # стандарт ссылается на ГОСТ 7.1-2003, в РФ заменён
  order: any               # п. 5.6.3: алфавитный, систематический или хронологический
