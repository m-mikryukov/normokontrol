# Базовый профиль: ГОСТ 7.32-2017
# «Отчёт о научно-исследовательской работе. Структура и правила оформления».
# Значения сверить с текстом стандарта перед первым релизом.
# Ссылки на пункты — в references/gost-7.32-2017.md.

name: ГОСТ 7.32-2017
id: gost-7.32-2017

page:
  size: A4
  margins_mm:
    left: 30
    right: 15
    top: 20
    bottom: 20
  tolerance_mm: 0.5

text:
  font: Times New Roman
  size_pt_min: 12        # ГОСТ задаёт минимум; вузы обычно требуют 14
  color: black
  line_spacing: 1.5
  first_line_indent_cm: 1.25
  alignment: justify
  table_text_size_pt_min: null   # ГОСТ допускает меньший кегль в таблицах; минимум задаёт методичка

page_numbers:
  style: arabic
  position: bottom_center
  trailing_dot: false
  title_page_counted: true
  title_page_shown: false

headings:
  structural_elements:   # РЕФЕРАТ, СОДЕРЖАНИЕ, ВВЕДЕНИЕ, ЗАКЛЮЧЕНИЕ и т. д.
    names:
      - СПИСОК ИСПОЛНИТЕЛЕЙ
      - РЕФЕРАТ
      - СОДЕРЖАНИЕ
      - ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ
      - ПЕРЕЧЕНЬ СОКРАЩЕНИЙ И ОБОЗНАЧЕНИЙ
      - ВВЕДЕНИЕ
      - ЗАКЛЮЧЕНИЕ
      - СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ
    case: upper
    alignment: center
    bold: true
    trailing_dot: false
    new_page: true
  sections:
    alignment: left
    first_line_indent_cm: 1.25
    bold: true
    trailing_dot: false
    numbering: arabic    # 1, 1.1, 1.1.1
    number_trailing_dot: false   # «1.1 Название», а не «1.1. Название» # TODO: сверить

appendices:
  heading_word: ПРИЛОЖЕНИЕ
  alignment: center
  new_page: true

figures:
  image_alignment: center   # TODO: сверить
  caption_position: below
  caption_alignment: center
  caption_first_line_indent_cm: 0
  caption_format: "Рисунок {n} — {title}"
  caption_trailing_dot: false
  references_required: true  # на каждый рисунок должна быть ссылка в тексте

tables:
  caption_position: above
  caption_alignment: left
  caption_first_line_indent_cm: 0
  caption_format: "Таблица {n} — {title}"
  caption_trailing_dot: false
  references_required: true

formulas:
  numbering: "({n})"
  number_alignment: right

bibliography:
  heading: СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ
  heading_aliases:          # распознаём, но предлагаем заменить на heading
    - СПИСОК ЛИТЕРАТУРЫ
    - СПИСОК ИСПОЛЬЗОВАННОЙ ЛИТЕРАТУРЫ
    - БИБЛИОГРАФИЧЕСКИЙ СПИСОК
    - ИСТОЧНИКИ
  standard: ГОСТ Р 7.0.100-2018
  order: by_citation     # TODO: сверить, допускается ли алфавитный порядок
  citation_style: "[{n}]"
