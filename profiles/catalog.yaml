# Каталог: какие документы оформляем, по каким стандартам и насколько это готово.
# Агент начинает работу с вопроса о типе документа по этому списку (scripts/catalog.py).
#
# readiness:
#   ready    — проверка и исправление работают, значения сверены со стандартом;
#   beta     — работает, но мало проверено на реальных документах;
#   limited  — стандарт задаёт мало требований, проверяется только часть (структура, ссылки);
#   planned  — профиля нет, документ не оформляем, только объясняем, чего не хватает.

document_types:
  nir_report:
    title: Отчёт о научно-исследовательской работе (НИР)
    profile: gost-7.32-2017
  vkr:
    title: Выпускная квалификационная работа (бакалавр, специалист, магистр)
    profile: student-work-gost-7.32-2017
    note: Отдельного ГОСТа нет. Главнее методичка вуза — попросите её.
  coursework:
    title: Курсовая работа или курсовой проект
    profile: student-work-gost-7.32-2017
    note: Отдельного ГОСТа нет. Главнее методичка вуза — попросите её.
  essay:
    title: Реферат
    profile: student-work-gost-7.32-2017
    note: Отдельного ГОСТа нет. Главнее методичка вуза — попросите её.
  practice_report:
    title: Отчёт о практике
    profile: student-work-gost-7.32-2017
    note: Отдельного ГОСТа нет. Главнее методичка вуза — попросите её.
  dissertation:
    title: Диссертация (кандидатская или докторская, рукопись)
    profile: gost-r-7.0.11-2011-dissertation
    note: >-
      Требования диссертационного совета главнее — попросите их. Гарнитуру шрифта и
      полужирность заголовков ГОСТ Р 7.0.11 не задаёт.
  autoreferat:
    title: Автореферат диссертации
    profile: gost-r-7.0.11-2011-autoreferat
    note: >-
      ГОСТ задаёт только структуру. Формат брошюры, шрифт и поля — по требованиям
      совета; без них проверяем только структуру и ссылки.
  technical_doc:
    title: Пояснительная записка, техническая документация (ЕСКД)
    profile: null
    readiness: planned
    note: >-
      Нужен профиль по ГОСТ Р 2.105-2019 (рамки и основная надпись по ГОСТ 2.104).
      Пока не оформляем.

# Статус проверен по карточкам Росстандарта и справочным системам; дата проверки — checked.
standards:
  gost-7.32-2017:
    title: ГОСТ 7.32-2017 «Отчёт о научно-исследовательской работе. Структура и правила оформления»
    scope: структура и оформление отчёта о НИР; по традиции — основа методичек для ВКР и курсовых
    status: действует
    in_force_since: 2018-07-01
    replaces: ГОСТ 7.32-2001
    amendments: поправки (ИУС 2-2019, 3-2020, 1-2022)
    checked: 2026-10-19
    source: https://protect.gost.ru/gost/details/7d280e43-7036-4a69-8e6e-d15867028343
  gost-r-7.0.11-2011:
    title: ГОСТ Р 7.0.11-2011 «Диссертация и автореферат диссертации. Структура и правила оформления»
    scope: кандидатские и докторские диссертации (рукопись, научный доклад) и авторефераты
    status: действует
    in_force_since: 2012-09-01
    checked: 2026-10-19
    source: https://protect.gost.ru/document.aspx?control=7&id=179727
    note: >-
      Внутри ссылается на ГОСТ 7.1-2003 и ГОСТ 2.105-95 — в РФ они заменены
      ГОСТ Р 7.0.100-2018 и ГОСТ Р 2.105-2019; по п. 2 стандарта применяются заменяющие.
  gost-r-7.0.100-2018:
    title: ГОСТ Р 7.0.100-2018 «Библиографическая запись. Библиографическое описание. Общие требования и правила составления»
    scope: описание источников в списке литературы
    status: действует (с поправкой)
    in_force_since: 2019-07-01
    replaces: ГОСТ 7.1-2003 (в РФ)
    checked: 2026-10-19
    source: https://protect.gost.ru/gost/details/389dfd5a-535a-458a-81c3-14b729b1cee1
  gost-r-7.0.5-2008:
    title: ГОСТ Р 7.0.5-2008 «Библиографическая ссылка. Общие требования и правила составления»
    scope: ссылки на источники в тексте и сносках
    status: действует
    in_force_since: 2009-01-01
    checked: 2026-10-19
    source: https://protect.gost.ru/gost/details/2eef7820-44bc-49a4-bf1f-fe51c54039dc
  gost-r-2.105-2019:
    title: ГОСТ Р 2.105-2019 «ЕСКД. Общие требования к текстовым документам»
    scope: текстовые конструкторские документы; на него ссылаются ГОСТ 7.32 и ГОСТ Р 7.0.11 в части рисунков, таблиц, формул
    status: действует (с Изменением № 1 от 01.02.2021)
    in_force_since: 2020-02-01
    replaces: ГОСТ 2.105-95 (в РФ)
    checked: 2026-10-19
    source: https://www.normacs.info/ntds/10165

# Не ГОСТ, но влияет на диссертации. Оформление файла не регулирует.
regulations:
  pp-842:
    title: Постановление Правительства РФ от 24.09.2013 № 842 «О порядке присуждения учёных степеней»
    scope: >-
      процедура защиты и требования к содержанию диссертации (новизна, ссылки на
      заимствования, публикации). Оформление не задаёт; инструмент только напоминает
      о ссылках на источники заимствований.
    status: действует, регулярно изменяется — актуальную редакцию брать на pravo.gov.ru или в КонсультантПлюс
    checked: 2026-10-19
    source: http://government.ru/docs/all/88745/
