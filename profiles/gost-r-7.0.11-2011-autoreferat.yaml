# Автореферат диссертации: ГОСТ Р 7.0.11-2011, разделы 8–9.
#
# Стандарт задаёт только структуру автореферата и состав сведений на обложке.
# Формат, поля, шрифт и объём он не задаёт: автореферат печатают «типографским
# способом или на множительном аппарате» (п. 9.4), выходные сведения — по ГОСТ Р 7.0.4.
# Требования к вёрстке берутся у диссертационного совета — их добавляют профилем-наследником.
# Поэтому этот профиль проверяет структуру, ссылки и список работ, а не вёрстку.

